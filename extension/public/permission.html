<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Microphone Activation — Owly.AI Voicebot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #171B3D;
    }
    .card {
      background: #FFFFFF;
      max-width: 480px;
      width: 100%;
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px -15px rgba(23, 27, 61, 0.08), 0 0 1px rgba(23, 27, 61, 0.1);
      text-align: center;
      border: 1px solid #E2E8F0;
      position: relative;
    }
    .lang-switcher {
      position: absolute;
      top: 16px;
      right: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      color: #475569;
      transition: all 0.15s ease;
    }
    .lang-switcher:hover {
      background: #E2E8F0;
      color: #1E293B;
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: #EFF6FF;
      border: 2px solid #DBEAFE;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-badge img {
      width: 46px;
      height: 46px;
      object-fit: contain;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #171B3D;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #64748B;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #398CF5 0%, #7045ED 100%);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px -4px rgba(57, 140, 245, 0.35);
    }
    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 12px 24px -4px rgba(57, 140, 245, 0.45);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .status-box {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
    }
    .status-success {
      background: #ECFDF5;
      color: #065F46;
      border: 1px solid #A7F3D0;
    }
    .status-error {
      background: #FEF2F2;
      color: #991B1B;
      border: 1px solid #FECACA;
    }
  </style>
</head>
<body>
  <div class="card">
    <button id="langBtn" class="lang-switcher" title="Switch Language / Ganti Bahasa">
      🌐 <span id="langLabel">EN / ID</span>
    </button>

    <div class="logo-badge">
      <img src="owly.png" alt="Owly.AI Logo">
    </div>
    <h1 id="permHeading">Activate Microphone Access</h1>
    <p id="permDesc">
      Chrome requires microphone permission to be granted via a standard tab before it can be used in the Side Panel. Click the button below, then select <strong>"Allow"</strong> on the browser popup prompt.
    </p>

    <button id="btnGrant" class="btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" x2="12" y1="19" y2="22"/>
      </svg>
      <span id="btnText">Allow Microphone Access</span>
    </button>

    <div id="statusBox" class="status-box"></div>
  </div>

  <script src="permission.js"></script>
</body>
</html>
